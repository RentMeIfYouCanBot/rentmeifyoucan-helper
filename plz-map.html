<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PLZ-Karte</title>
<!--
  Tap-to-pick postcode map for RentMeIfYouCan's /map (a Telegram Mini App).
  Host this file next to plz-berlin.json (made by cmd/genplzmap) on HTTPS and
  set PLZ_MAP_URL to its address. The bot opens it from a keyboard button
  with the user's area in the query (?lang=de&d=Mitte,Pankow&p=10997);
  "Save" sends the picked postcodes back with Telegram.WebApp.sendData
  ("plz:10115,10117"; "plz:" = all of Berlin).
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1e1e1e);
    --hint: var(--tg-theme-hint-color, #777777);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: var(--secondary); }
  #bar select, #bar button { font: inherit; border: 0; border-radius: 8px; padding: 7px 10px;
    background: var(--bg); color: var(--text); }
  #bar select { flex: 1; min-width: 0; }
  #count { padding: 4px 10px 6px; color: var(--hint); font-size: 13px; background: var(--secondary); }
  #map { flex: 1; background: #e4e7ea; }
  #save { display: none; margin: 8px 10px; padding: 12px; border: 0; border-radius: 10px;
    font: inherit; font-weight: 600; background: var(--button); color: var(--button-text); }
  .plz-label { background: transparent; border: 0; box-shadow: none; padding: 0;
    font-weight: 700; font-size: 12px; color: #1e1e1e;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff; }
  .plz-label::before { display: none; }
  .hide-labels .plz-label { display: none; }
  #error { padding: 20px; color: #c62828; display: none; }
  .leaflet-control-attribution { font-size: 10px; line-height: 1.25; }
</style>
</head>
<body>
<div id="bar">
  <select id="district"></select>
  <button id="clear"></button>
</div>
<div id="count"></div>
<div id="error"></div>
<div id="map"></div>
<button id="save"></button>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const lang = (params.get("lang") || (navigator.language || "de")).toLowerCase().startsWith("de") ? "de" : "en";
const T = {
  de: { district: "Ganzen Bezirk wählen …", clear: "Leeren", all: "Nichts gewählt: ganz Berlin",
        n: n => n === 1 ? "1 Postleitzahl gewählt" : n + " Postleitzahlen gewählt",
        hint: "Tippe Gebiete an, um sie zu wählen.", save: "Speichern", saveAll: "Speichern (ganz Berlin)",
        error: "Die Karte konnte nicht geladen werden." },
  en: { district: "Pick a whole district …", clear: "Clear", all: "Nothing picked: all of Berlin",
        n: n => n === 1 ? "1 postcode picked" : n + " postcodes picked",
        hint: "Tap areas to pick them.", save: "Save", saveAll: "Save (all of Berlin)",
        error: "The map couldn't be loaded." },
}[lang];

const tg = window.Telegram && Telegram.WebApp;
// Opened from a keyboard button (the only way sendData works), the Mini App
// gets no initData, but every Telegram app sets the platform.
const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");
if (tg) { tg.ready(); tg.expand(); }

const picked = new Set();
const layers = {};   // postcode → polygon
let areas = [];      // {c, d, l, p}

// Coordinates are integers (degrees × 100000); after a ring's first point,
// each is the difference to the point before.
function decode(polys) {
  return polys.map(rings => rings.map(flat => {
    const out = [];
    let x = 0, y = 0;
    for (let i = 0; i + 1 < flat.length; i += 2) {
      x += flat[i]; y += flat[i + 1];
      out.push([y / 1e5, x / 1e5]);
    }
    return out;
  }));
}

const map = L.map("map", { preferCanvas: true, zoomControl: false, attributionControl: true });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(map);

function style(code) {
  const on = picked.has(code);
  return { color: on ? "#2e7d32" : "#5f5a50", weight: on ? 1.5 : 1, opacity: 0.8,
           fillColor: on ? "#43a047" : "#ffffff", fillOpacity: on ? 0.55 : 0.08 };
}

function refresh() {
  for (const c in layers) layers[c].setStyle(style(c));
  const n = picked.size;
  document.getElementById("count").textContent = n ? T.n(n) : T.all + " · " + T.hint;
  const label = n ? T.save + " · " + T.n(n) : T.saveAll;
  if (inTelegram) {
    tg.MainButton.setText(label);
    tg.MainButton.show();
  } else {
    const b = document.getElementById("save");
    b.textContent = label;
    b.style.display = "block";
  }
}

function toggle(code) {
  if (picked.has(code)) picked.delete(code); else picked.add(code);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  refresh();
}

function districtCodes(name) {
  return areas.filter(a => a.d.includes(name)).map(a => a.c);
}

function save() {
  const data = "plz:" + [...picked].sort().join(",");
  if (inTelegram) tg.sendData(data); // closes the Mini App
  else alert("Not in Telegram, nothing saved: " + data);
}

function updateLabels() {
  document.getElementById("map").classList.toggle("hide-labels", map.getZoom() < 12);
}

fetch("plz-berlin.json").then(r => {
  if (!r.ok) throw new Error(r.status);
  return r.json();
}).then(data => {
  areas = data.plz;
  map.attributionControl.addAttribution(data.source);
  const bounds = L.latLngBounds([]);
  for (const a of areas) {
    const pickable = a.d.length > 0;
    const poly = L.polygon(decode(a.p), pickable ? style(a.c) :
      { color: "#999", weight: 1, fillColor: "#999", fillOpacity: 0.25, interactive: false });
    poly.addTo(map);
    bounds.extend(poly.getBounds());
    if (!pickable) continue;
    layers[a.c] = poly;
    poly.on("click", () => toggle(a.c));
    L.tooltip({ permanent: true, direction: "center", className: "plz-label", interactive: false })
      .setLatLng([a.l[1] / 1e5, a.l[0] / 1e5]).setContent(a.c).addTo(map);
  }
  for (const d of data.districts) {
    L.polygon(decode(d.p), { color: "#202020", weight: 2.5, fill: false, interactive: false }).addTo(map);
  }
  map.fitBounds(bounds, { padding: [4, 4] });
  map.on("zoomend", updateLabels);
  updateLabels();

  // The user's area from the bot.
  for (const name of (params.get("d") || "").split(",").filter(Boolean)) {
    for (const c of districtCodes(name)) picked.add(c);
  }
  for (const c of (params.get("p") || "").split(",")) {
    if (layers[c]) picked.add(c);
  }

  const sel = document.getElementById("district");
  sel.add(new Option(T.district, ""));
  for (const d of data.districts.map(d => d.n).sort((a, b) => a.localeCompare(b, "de"))) sel.add(new Option(d, d));
  sel.onchange = () => {
    const codes = districtCodes(sel.value);
    if (codes.length) {
      const all = codes.every(c => picked.has(c));
      for (const c of codes) all ? picked.delete(c) : picked.add(c);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      refresh();
      const b = L.latLngBounds([]);
      for (const c of codes) b.extend(layers[c].getBounds());
      map.fitBounds(b, { padding: [10, 10] });
    }
    sel.value = "";
  };
  refresh();
}).catch(err => {
  const e = document.getElementById("error");
  e.textContent = T.error + " (" + err.message + ")";
  e.style.display = "block";
});

document.getElementById("clear").textContent = T.clear;
document.getElementById("clear").onclick = () => { picked.clear(); refresh(); };
document.getElementById("save").onclick = save;
if (inTelegram) tg.MainButton.onClick(save);
</script>
</body>
</html>

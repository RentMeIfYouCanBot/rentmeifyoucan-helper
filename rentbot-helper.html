<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<!-- The newest rentbot-helper.user.js @version: older scripts offer the update. -->
<meta name="rentbot-helper-version" content="1.0.7">
<title>RentBot form helper</title>
<style>
  :root {
    --bg: #f4f6f5; --card: #fff; --text: #17201b; --muted: #5d6b63; --line: #dfe5e1;
    --accent: #2e9d5b; --accent-text: #fff; --warn: #b86b00; --soft: #eaf5ee;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111613; --card: #1b221e; --text: #eef3f0; --muted: #9db0a5; --line: #2c3631;
      --accent: #3fb36f; --accent-text: #08130c; --warn: #f0a33a; --soft: #1f3327; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; line-height: 1.25; margin: 8px 0 12px; }
  h2 { font-size: 17px; margin: 22px 0 8px; }
  p { margin: 8px 0; }
  a { color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin: 14px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .btn { display: block; width: 100%; text-align: center; text-decoration: none; cursor: pointer;
    font: inherit; font-weight: 600; padding: 13px 16px; margin: 10px 0 0; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  ol { padding-left: 22px; margin: 8px 0; }
  li { margin: 8px 0; }
  .answers { list-style: none; padding: 0; margin: 8px 0 0; }
  .answers li { display: flex; flex-direction: column; padding: 8px 0; border-top: 1px solid var(--line); margin: 0; }
  .answers .l { font-size: 13px; color: var(--muted); }
  .answers button { all: unset; cursor: pointer; font-weight: 600; word-break: break-word; }
  .answers .self { color: var(--warn); font-style: italic; font-weight: 400; }
  .ok { background: var(--soft); }
  .step h2 { display: flex; align-items: center; gap: 10px; margin: 0; }
  .step p:first-of-type { margin-top: 10px; }
  .step .num { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
    font-size: 14px; background: var(--line); color: var(--text); }
  .step.cur { border-color: var(--accent); }
  .step.cur .num { background: var(--accent); color: var(--accent-text); }
  .step.done .num { background: var(--soft); color: var(--accent); }
  .step.done h2, .step.locked h2 { font-size: 15px; color: var(--muted); }
  .step.locked { opacity: .6; }
  .step.locked p { margin: 4px 0 0 36px; }
  .btn.small { width: auto; display: inline-block; padding: 6px 12px; font-size: 14px; font-weight: 500; }
  .warn { border-left: 3px solid var(--warn); padding: 2px 0 2px 12px; margin: 10px 0; }
  .warn p { margin: 0 0 4px; }
  .spin { display: inline-block; width: 18px; height: 18px; margin-right: 8px; vertical-align: -3px;
    border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app"><p><span class="spin"></span></p></main>
<div class="toast" id="toast"></div>
<script>
'use strict';
// The RentBot form helper page. Modes (URL fragment, never sent to a server):
//   #f=<answers>      from a "✍️ Fill in form" button: with the userscript, it
//                     stores the answers and opens the form (the script does
//                     that); without, this page offers the right browser or
//                     shows the answers to copy.
//   #test&b=<bot>     checks that the userscript runs in this browser.
//   (none / #install) how to install the userscript.
(function () {
  const app = document.getElementById('app');
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const ua = navigator.userAgent;
  const android = /Android/i.test(ua);
  const ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const scriptURL = new URL('rentbot-helper.user.js', location.href).href;
  let lang = (hash.get('l') || navigator.language || 'en').slice(0, 2) === 'de' ? 'de' : 'en';

  const T = {
    de: {
      opening: 'Formular wird geöffnet…',
      notActiveTitle: 'Der Helfer läuft in diesem Browser nicht',
      notActive: 'Wahrscheinlich hat Telegram den Link in seinem eigenen Browser geöffnet. Öffne ihn in dem Browser, in dem du den Helfer installiert hast:',
      inFirefox: 'In Firefox öffnen',
      inOther: 'In anderem Browser öffnen',
      inSafari: 'In Safari öffnen',
      copyLink: 'Link kopieren',
      copied: 'Kopiert',
      orByHand: 'Oder von Hand ausfüllen',
      byHand: 'Tippe auf eine Antwort, um sie zu kopieren.',
      openForm: 'Formular ohne Helfer öffnen',
      yourself: 'selbst ausfüllen',
      tipTitle: 'Damit es jedes Mal klappt',
      tipAndroid: 'In Telegram: Einstellungen → Chat-Einstellungen → „In-App-Browser“ ausschalten. Dann öffnen Links in deinem Standardbrowser (mach Firefox dazu: Android-Einstellungen → Apps → Standard-Apps → Browser).',
      tipIOS: 'In Telegram: Einstellungen → Daten und Speicher (oder Chat-Einstellungen) → „Links öffnen in“ → Safari.',
      tipOther: 'Stell Telegram so ein, dass Links in deinem normalen Browser öffnen, nicht im Telegram-Browser.',
      install: 'Helfer installieren',
      badLink: 'Dieser Link ist unvollständig. Tippe in Telegram noch einmal auf den Button.',
      error: 'Der Helfer konnte die Antworten nicht lesen: ',
      testOk: '✅ Der Helfer funktioniert in diesem Browser',
      testOkText: 'Ab jetzt füllt der Button „✍️ Formular ausfüllen“ die Formulare für dich aus. Du prüfst, löst das Captcha und sendest ab.',
      back: 'Zurück zu Telegram',
      testNo: '❌ Der Helfer ist in diesem Browser nicht aktiv',
      testNoText: 'Wenn du ihn schon installiert hast, öffne diese Seite in dem Browser, in dem er installiert ist:',
      checkAgain: 'Nochmal prüfen',
      installTitle: 'RentBot-Formular-Helfer',
      installIntro: 'Der Helfer füllt Bewerbungsformulare (degewo, Gewobag, berlinovo, Stadt und Land, WBM, HOWOGE, GESOBAU) mit den Antworten aus deinem Profil aus. Du prüfst, löst das Captcha, wo es eins gibt, und sendest selbst ab. Einmal einrichten, etwa 2 Minuten.',
      installed: '✅ Der Helfer ist in diesem Browser installiert.',
      installBtn: '📲 Helfer installieren',
      reinstall: 'Neu installieren',
      updateTitle: (v) => `🆕 Neue Helfer-Version ${v}`,
      updateText: (old) => `Installiert ist ${old}. Tippe auf „Aktualisieren“ und bestätige. Komm danach zurück, die Seite prüft es dann.`,
      updateBtn: 'Aktualisieren',
      stuck: 'Nichts passiert? Im Browser von Telegram kann Violentmonkey sein Fenster nicht zeigen. Tippe oben rechts auf ⋮ → „In Firefox öffnen“ und dort noch einmal auf den Button. (Vielleicht wartet das Fenster auch schon in der Firefox-App.)',
      step: 'Schritt',
      later: 'kommt nach dem Schritt davor',
      noFirefox: 'Noch kein Firefox? <a href="https://play.google.com/store/apps/details?id=org.mozilla.firefox">Aus dem Play Store holen</a>, dann hier auf „In Firefox öffnen“ tippen.',
      getVM: 'Violentmonkey hinzufügen',
      getUS: 'Userscripts aus dem App Store',
      mgrDone: { android: '✓ Violentmonkey ist installiert', ios: '✓ Userscripts ist eingeschaltet', desktop: '✓ Die Erweiterung ist installiert' },
      mgrBack: 'Zurück zum Schritt davor',
      steps: {
        android: [
          ['Firefox', 'Der Helfer läuft in Firefox (Chrome kann keine Erweiterungen). Öffne diese Seite in Firefox.'],
          ['Violentmonkey', 'In Firefox: Menü ⋮ → Erweiterungen → <a href="https://addons.mozilla.org/android/addon/violentmonkey/">Violentmonkey</a> → Hinzufügen. Ohne Violentmonkey zeigt der Installieren-Button nur Text an.'],
          ['Helfer', 'Tippe auf „Helfer installieren“ und bestätige mit „Installieren“. Komm danach in diesen Tab zurück, er prüft dann selbst, ob es geklappt hat.'],
          ['Telegram', 'Damit Telegram Links in Firefox öffnet: Firefox als Standardbrowser festlegen und in Telegram unter Einstellungen → Chat-Einstellungen den „In-App-Browser“ ausschalten. Dann im Bot testen: /helper → 🧪 Testen.']
        ],
        ios: [
          ['Safari', 'Der Helfer läuft in Safari. Öffne diese Seite in Safari.'],
          ['Userscripts', 'Installiere die kostenlose App <a href="https://apps.apple.com/app/id1463298887">Userscripts</a>. Dann: Einstellungen-App → Apps → Safari → Erweiterungen → Userscripts: einschalten und „Alle Websites“ erlauben.'],
          ['Helfer', 'Tippe auf „Helfer installieren“. Tippe dann in der Adressleiste auf das Erweiterungs-Symbol (ᴀA oder 🧩) → Userscripts → Installieren. Geh danach zurück zu dieser Seite, sie prüft dann selbst, ob es geklappt hat.'],
          ['Telegram', 'In Telegram: Einstellungen → Daten und Speicher (oder Chat-Einstellungen) → „Links öffnen in“ → Safari. Dann im Bot testen: /helper → 🧪 Testen.']
        ],
        desktop: [
          ['Erweiterung', 'Installiere die Browser-Erweiterung <a href="https://violentmonkey.github.io/">Violentmonkey</a> oder <a href="https://www.tampermonkey.net/">Tampermonkey</a>. Ohne sie zeigt der Installieren-Button nur Text an.'],
          ['Helfer', 'Klicke auf „Helfer installieren“ und bestätige. Komm danach in diesen Tab zurück, er prüft dann selbst, ob es geklappt hat.'],
          ['Testen', 'Teste es im Bot: /helper → 🧪 Testen.']
        ]
      },
      fail: {
        android: 'Der Helfer ist noch nicht aktiv. Kam statt „Installieren“ nur eine Seite voller Text? Dann fehlt Violentmonkey in diesem Firefox oder es ist ausgeschaltet (Menü ⋮ → Erweiterungen).',
        ios: 'Der Helfer ist noch nicht aktiv. Hast du auf der Textseite über das Erweiterungs-Symbol → Userscripts auf „Installieren“ getippt? Ist Userscripts für „Alle Websites“ erlaubt?',
        desktop: 'Der Helfer ist noch nicht aktiv. Kam statt „Installieren“ nur eine Seite voller Text? Dann fehlt die Erweiterung in diesem Browser oder sie ist ausgeschaltet.'
      },
      other: 'Andere Geräte',
      privacy: 'Deine Antworten stehen nur im Link (hinter dem #) und werden an keinen Server geschickt. Der Helfer schickt nie etwas ab.'
    },
    en: {
      opening: 'Opening the form…',
      notActiveTitle: "The helper isn't running in this browser",
      notActive: 'Telegram probably opened the link in its own browser. Open it in the browser where you installed the helper:',
      inFirefox: 'Open in Firefox',
      inOther: 'Open in another browser',
      inSafari: 'Open in Safari',
      copyLink: 'Copy link',
      copied: 'Copied',
      orByHand: 'Or fill it in by hand',
      byHand: 'Tap an answer to copy it.',
      openForm: 'Open the form without the helper',
      yourself: 'fill in yourself',
      tipTitle: 'To make it work every time',
      tipAndroid: 'In Telegram: Settings → Chat Settings → turn off “In-App Browser”. Links then open in your default browser (make that Firefox: Android Settings → Apps → Default apps → Browser).',
      tipIOS: 'In Telegram: Settings → Data and Storage (or Chat Settings) → “Open Links in” → Safari.',
      tipOther: "Set Telegram to open links in your normal browser, not in Telegram's own browser.",
      install: 'Install the helper',
      badLink: 'This link is incomplete. Tap the button in Telegram again.',
      error: "The helper couldn't read the answers: ",
      testOk: '✅ The helper works in this browser',
      testOkText: 'From now on, the “✍️ Fill in form” button fills in forms for you. You check them, solve the captcha and send.',
      back: 'Back to Telegram',
      testNo: "❌ The helper isn't active in this browser",
      testNoText: 'If you already installed it, open this page in the browser where it is installed:',
      checkAgain: 'Check again',
      installTitle: 'RentBot form helper',
      installIntro: 'The helper fills in application forms (degewo, Gewobag, berlinovo, Stadt und Land, WBM, HOWOGE, GESOBAU) with the answers from your profile. You check them, solve the captcha where there is one, and send yourself. Set it up once, about 2 minutes.',
      installed: '✅ The helper is installed in this browser.',
      installBtn: '📲 Install the helper',
      reinstall: 'Install again',
      updateTitle: (v) => `🆕 New helper version ${v}`,
      updateText: (old) => `You have ${old}. Tap “Update” and confirm. Then come back; the page checks it.`,
      updateBtn: 'Update',
      stuck: 'Nothing happened? In Telegram’s browser, Violentmonkey can’t show its window. Tap ⋮ at the top right → “Open in Firefox” and tap the button again there. (The window may also be waiting in the Firefox app already.)',
      step: 'Step',
      later: 'comes after the step before',
      noFirefox: 'No Firefox yet? <a href="https://play.google.com/store/apps/details?id=org.mozilla.firefox">Get it from the Play Store</a>, then tap “Open in Firefox” here.',
      getVM: 'Add Violentmonkey',
      getUS: 'Userscripts in the App Store',
      mgrDone: { android: '✓ Violentmonkey is installed', ios: '✓ Userscripts is turned on', desktop: '✓ The extension is installed' },
      mgrBack: 'Back to the step before',
      steps: {
        android: [
          ['Firefox', 'The helper runs in Firefox (Chrome can’t run extensions). Open this page in Firefox.'],
          ['Violentmonkey', 'In Firefox: menu ⋮ → Extensions → <a href="https://addons.mozilla.org/android/addon/violentmonkey/">Violentmonkey</a> → Add. Without Violentmonkey, the install button only shows text.'],
          ['Helper', 'Tap “Install the helper” and confirm with “Install”. Then come back to this tab; it checks by itself whether it worked.'],
          ['Telegram', 'So that Telegram opens links in Firefox: make Firefox your default browser, and in Telegram turn off Settings → Chat Settings → “In-App Browser”. Then test it in the bot: /helper → 🧪 Test.']
        ],
        ios: [
          ['Safari', 'The helper runs in Safari. Open this page in Safari.'],
          ['Userscripts', 'Install the free app <a href="https://apps.apple.com/app/id1463298887">Userscripts</a>. Then: Settings app → Apps → Safari → Extensions → Userscripts: turn it on and allow “All Websites”.'],
          ['Helper', 'Tap “Install the helper”. Then tap the extensions icon in the address bar (ᴀA or 🧩) → Userscripts → Install. Then go back to this page; it checks by itself whether it worked.'],
          ['Telegram', 'In Telegram: Settings → Data and Storage (or Chat Settings) → “Open Links in” → Safari. Then test it in the bot: /helper → 🧪 Test.']
        ],
        desktop: [
          ['Extension', 'Install the browser extension <a href="https://violentmonkey.github.io/">Violentmonkey</a> or <a href="https://www.tampermonkey.net/">Tampermonkey</a>. Without it, the install button only shows text.'],
          ['Helper', 'Click “Install the helper” and confirm. Then come back to this tab; it checks by itself whether it worked.'],
          ['Test', 'Test it in the bot: /helper → 🧪 Test.']
        ]
      },
      fail: {
        android: 'The helper isn’t active yet. Did you get a page full of text instead of “Install”? Then Violentmonkey is missing in this Firefox, or turned off (menu ⋮ → Extensions).',
        ios: 'The helper isn’t active yet. On the text page, did you tap the extensions icon → Userscripts → “Install”? Is Userscripts allowed on “All Websites”?',
        desktop: 'The helper isn’t active yet. Did you get a page full of text instead of “Install”? Then the extension is missing in this browser, or turned off.'
      },
      other: 'Other devices',
      privacy: 'Your answers are only in the link (after the #) and are never sent to a server. The helper never sends anything.'
    }
  };
  let t = T[lang];

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const active = () => document.documentElement.hasAttribute('data-rentbot-helper');
  // Android: the install link opens in a new tab. In Telegram's browser (a
  // Firefox custom tab) that may hand it to the full Firefox, where the
  // script manager can show its install window.
  const newTab = android ? ' target="_blank" rel="noopener"' : '';
  // The userscript marks the page with its version; the meta tag names the
  // newest one.
  const latest = (document.querySelector('meta[name="rentbot-helper-version"]') || {}).content || '';
  const installedVersion = () => document.documentElement.getAttribute('data-rentbot-helper') || '0';
  const newer = (a, b) => {
    const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
    for (let i = 0; i < Math.max(x.length, y.length); i++) {
      const d = (x[i] || 0) - (y[i] || 0);
      if (d) return d > 0;
    }
    return false;
  };
  const outdated = () => active() && newer(latest, installedVersion());
  const updateCard = () => `<div class="card"><h2 style="margin-top:0">${t.updateTitle(esc(latest))}</h2>
    <p>${t.updateText(esc(installedVersion()))}</p>
    <a class="btn primary" href="${esc(scriptURL)}"${newTab} data-try>${t.updateBtn}</a></div>`;
  const toast = (s) => {
    const el = document.getElementById('toast');
    el.textContent = s;
    el.classList.add('on');
    setTimeout(() => el.classList.remove('on'), 1200);
  };
  const copy = (s) => {
    const done = () => toast(t.copied);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, () => fallbackCopy(s, done));
    else fallbackCopy(s, done);
  };
  function fallbackCopy(s, done) {
    const ta = document.createElement('textarea');
    ta.value = s;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    ta.remove();
  }

  // The userscript marks the page at document-start; some script managers
  // (iOS) start a little later, so wait a moment before saying it's missing.
  function whenChecked(fn) {
    const end = Date.now() + 1500;
    (function poll() {
      if (active() || Date.now() > end) fn(active());
      else setTimeout(poll, 100);
    })();
  }

  async function decode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return JSON.parse(await new Response(stream).text());
  }

  // Buttons that reopen this exact page (with its fragment) in another browser.
  function browserButtons() {
    const here = location.host + location.pathname + location.search + location.hash;
    let h = '';
    if (android) {
      h += `<a class="btn primary" href="intent://${esc(here)}#Intent;scheme=https;package=org.mozilla.firefox;end">${t.inFirefox}</a>`;
      h += `<a class="btn" href="intent://${esc(here)}#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end">${t.inOther}</a>`;
    } else if (ios) {
      h += `<a class="btn primary" href="x-safari-https://${esc(here)}">${t.inSafari}</a>`;
    }
    h += `<button class="btn" data-copy="${esc(location.href)}">${t.copyLink}</button>`;
    return h;
  }

  function tip() {
    return `<h2>${t.tipTitle}</h2><p class="muted">${android ? t.tipAndroid : ios ? t.tipIOS : t.tipOther}</p>`;
  }

  function render(html) {
    app.innerHTML = html;
    app.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => copy(b.getAttribute('data-copy'))));
    app.querySelectorAll('[data-reload]').forEach((b) => b.addEventListener('click', () => location.reload()));
    app.querySelectorAll('[data-mgr]').forEach((b) => b.addEventListener('click', () => {
      ls.set('rbh-mgr', b.getAttribute('data-mgr') || null);
      attempt.set(null);
      rerender();
    }));
    app.querySelectorAll('[data-try]').forEach((b) => b.addEventListener('click', () => {
      attempt.set('1');
      if (android) stuckCheck(b);
    }));
  }

  // stuckCheck: the script manager answers an install link with its own
  // tab, which hides this page. In Telegram's browser (a Firefox custom tab)
  // that tab can't show up and nothing seems to happen; if this page is
  // still in front after a moment, say how to get to the full Firefox.
  function stuckCheck(btn) {
    let left = false;
    const away = () => { left = true; };
    document.addEventListener('visibilitychange', away, { once: true });
    window.addEventListener('pagehide', away, { once: true });
    setTimeout(() => {
      if (left || document.visibilityState !== 'visible' || btn.nextElementSibling?.classList.contains('stuck')) return;
      const d = document.createElement('div');
      d.className = 'warn stuck';
      d.innerHTML = `<p>${t.stuck}</p>`;
      btn.after(d);
    }, 2500);
  }

  // ---------- #f=… : fill a form ----------
  async function fill(data) {
    let p;
    try {
      p = await decode(data);
    } catch (e) {
      render(`<h1>${t.badLink}</h1>`);
      return;
    }
    if (p.l && T[p.l]) { lang = p.l; t = T[lang]; document.documentElement.lang = lang; }
    render(`<p><span class="spin"></span>${t.opening}</p>`);
    whenChecked((ok) => {
      if (ok) {
        // The userscript stores the answers and opens the form; only an
        // error is left for this page to show.
        setTimeout(() => {
          const err = document.documentElement.getAttribute('data-rentbot-error');
          if (err) render(`<h1>${esc(t.error + err)}</h1><a class="btn primary" href="${esc(p.u)}">${t.openForm}</a>`);
        }, 1500);
        return;
      }
      const list = (p.a || []).map(([label, value]) => value
        ? `<li><span class="l">${esc(label)}</span><button data-copy="${esc(value)}">${esc(value)}</button></li>`
        : `<li><span class="l">${esc(label)}</span><span class="self">${t.yourself}</span></li>`).join('');
      render(`
        <h1>${t.notActiveTitle}</h1>
        <p>${t.notActive}</p>
        ${browserButtons()}
        <div class="card">
          <h2 style="margin-top:0">${t.orByHand}</h2>
          ${p.t ? `<p><b>${esc(p.t)}</b></p>` : ''}
          <a class="btn primary" href="${esc(p.u)}">${t.openForm}</a>
          <p class="muted">${t.byHand}</p>
          <ul class="answers">${list}</ul>
        </div>
        ${tip()}
        <a class="btn" href="#install">${t.install}</a>`);
    });
  }

  // ---------- #test : is the userscript running here? ----------
  function test() {
    const bot = (hash.get('b') || '').replace(/[^\w]/g, '');
    rerender = test;
    whenChecked((ok) => {
      if (ok) {
        attempt.set(null);
        render(`<div class="card ok"><h1 style="margin-top:0">${t.testOk}</h1><p>${t.testOkText}</p>
          ${bot ? `<a class="btn primary" href="https://t.me/${bot}?start=helper">${t.back}</a>` : ''}</div>
          ${outdated() ? updateCard() : ''}`);
        return;
      }
      render(`<h1>${t.testNo}</h1><p>${t.testNoText}</p>${browserButtons()}
        <button class="btn" data-reload>${t.checkAgain}</button>${tip()}
        <h2>${t.install}</h2>${installSteps()}`);
    });
  }

  // ---------- install instructions ----------
  // A page can't see which extensions a browser has, so the install button
  // only shows once the steps before it are done: the right browser (from the
  // user agent) and the script manager (the user confirms it, remembered in
  // localStorage). Whether the install worked is checked for real: after the
  // button, coming back to this page reloads it once, and the userscript
  // marks it if it runs.
  const platform = android ? 'android' : ios ? 'ios' : 'desktop';
  const firefox = /Firefox\//.test(ua);
  const safari = /Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(ua);
  const ls = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  };
  // Install attempt: '1' = button tapped, '2' = came back, still not active.
  const attempt = {
    get: () => { try { return sessionStorage.getItem('rbh-try'); } catch (e) { return null; } },
    set: (v) => { try { v == null ? sessionStorage.removeItem('rbh-try') : sessionStorage.setItem('rbh-try', v); } catch (e) {} }
  };
  let rerender = () => {};

  function installSteps() {
    const ok = active();
    const steps = t.steps[platform];
    // What each step needs; the last one is never "done".
    const needs = platform === 'desktop' ? ['mgr', 'script', 'end'] : ['browser', 'mgr', 'script', 'end'];
    const done = (n) => n !== 'end' && (ok || (n === 'browser' ? (android ? firefox : safari)
      : n === 'mgr' ? ls.get('rbh-mgr') === '1' : false));
    let cur = needs.findIndex((n) => !done(n));
    if (ok) attempt.set(null);
    else if (attempt.get()) attempt.set('2');
    let h = !ok ? '' : outdated() ? updateCard() : `<div class="card ok">${t.installed}</div>`;
    steps.forEach(([title, body], i) => {
      const n = needs[i];
      const state = i < cur ? 'done' : i === cur ? 'cur' : 'locked';
      h += `<div class="card step ${state}"><h2><span class="num">${state === 'done' ? '✓' : i + 1}</span>${title}</h2>`;
      if (state === 'locked') h += `<p class="muted">${t.later}</p>`;
      if (state === 'cur') h += `<p>${body}</p>` + actions(n);
      if (state === 'done' && n === 'mgr' && !ok && attempt.get() !== '2') h += `<button class="btn small" data-mgr="">${t.mgrBack}</button>`;
      h += '</div>';
    });
    if (ok && !outdated()) h += `<a class="btn" href="${esc(scriptURL)}">${t.reinstall}</a>`;
    if (android || ios) {
      const other = t.steps[android ? 'ios' : 'android'];
      h += `<details class="card"><summary>${t.other} (${android ? 'iPhone / iPad' : 'Android'})</summary><ol>${other.map(([title, body]) => `<li><b>${title}:</b> ${body}</li>`).join('')}</ol></details>`;
    }
    return h;
  }

  function actions(n) {
    const here = location.host + location.pathname + location.search + location.hash;
    if (n === 'browser' && android) {
      return `<a class="btn primary" href="intent://${esc(here)}#Intent;scheme=https;package=org.mozilla.firefox;end">${t.inFirefox}</a>
        <p class="muted">${t.noFirefox}</p>`;
    }
    if (n === 'browser') {
      return `<a class="btn primary" href="x-safari-https://${esc(here)}">${t.inSafari}</a>
        <button class="btn" data-copy="${esc(location.href)}">${t.copyLink}</button>`;
    }
    if (n === 'mgr') {
      const get = android ? `<a class="btn" href="https://addons.mozilla.org/android/addon/violentmonkey/">${t.getVM}</a>`
        : ios ? `<a class="btn" href="https://apps.apple.com/app/id1463298887">${t.getUS}</a>` : '';
      return `${get}<button class="btn primary" data-mgr="1">${t.mgrDone[platform]}</button>`;
    }
    if (n === 'script') {
      const failed = attempt.get() === '2';
      return (failed ? `<div class="warn"><p>${t.fail[platform]}</p><button class="btn small" data-mgr="">${t.mgrBack}</button></div>` : '') +
        `<a class="btn primary" href="${esc(scriptURL)}"${newTab} data-try>${t.installBtn}</a>` +
        (failed ? `<button class="btn" data-reload>${t.checkAgain}</button>` : '');
    }
    return '';
  }

  // Coming back after the install button: reload once so a freshly
  // installed userscript runs on this page (a tab opened before the install
  // doesn't get it).
  function recheck() {
    if (attempt.get() === '1' && (!active() || outdated())) location.reload();
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') recheck(); });
  window.addEventListener('pageshow', (e) => { if (e.persisted) recheck(); });

  function install() {
    rerender = install;
    whenChecked(() => render(`<h1>${t.installTitle}</h1><p>${t.installIntro}</p>${installSteps()}<p class="muted">${t.privacy}</p>`));
  }

  document.documentElement.lang = lang;
  window.addEventListener('hashchange', () => location.reload());
  if (hash.has('f')) fill(hash.get('f'));
  else if (hash.has('test')) test();
  else install();
})();
</script>
</body>
</html>

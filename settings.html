<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Einstellungen</title>
<!--
  Settings view for RentMeIfYouCan (a Telegram Mini App on the chat's menu
  button). Set SETTINGS_APP_URL to this page's address. The bot gives every
  chat its own button URL with that chat's settings in the fragment:
  #rs=<base64url(zlib(JSON))>, JSON {l: lang, s: [{h: heading, n: note,
  r: [[label, value], ...], f: line under the rows}, ...]}. The fragment
  never reaches this page's host. View only: settings are changed in the
  chat with the bot.
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #efeff4);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --head: var(--tg-theme-section-header-text-color, #6d6d72);
    --accent: var(--tg-theme-accent-text-color, var(--tg-theme-link-color, #2481cc));
    --sep: var(--tg-theme-section-separator-color, rgba(128, 128, 128, .22));
    --warn: #b26a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.tg) { --bg: #101014; --card: #1c1c1e; --text: #f2f2f7; --hint: #8e8e93; --head: #8e8e93; --accent: #64b5f6; --warn: #ffb74d; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); }
  h2 { margin: 18px 14px 6px; font-size: 13px; font-weight: 600; letter-spacing: .02em;
    text-transform: uppercase; color: var(--head); }
  h2:first-child { margin-top: 6px; }
  .card { background: var(--card); border-radius: 12px; overflow: hidden; }
  .note { padding: 10px 14px; color: var(--warn); font-size: 14px; border-bottom: 1px solid var(--sep); }
  .row { display: flex; gap: 12px; align-items: baseline; padding: 10px 14px; }
  .row + .row { border-top: 1px solid var(--sep); }
  .label { flex: 1 1 auto; min-width: 0; }
  .value { flex: 0 1 auto; max-width: 60%; text-align: right; overflow-wrap: anywhere; color: var(--hint); }
  .row.long { display: block; }
  .row.long .value { max-width: none; text-align: left; margin-top: 3px; color: var(--text); white-space: pre-wrap; }
  .foot { padding: 10px 14px; border-top: 1px solid var(--sep); color: var(--hint); font-size: 14px; }
  footer { margin: 18px 14px 0; color: var(--hint); font-size: 13px; }
  #error { margin: 24px 14px; color: var(--text); }
</style>
</head>
<body>
<main id="main"></main>
<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;
const inTelegram = !!tg && tg.platform && tg.platform !== "unknown";
if (inTelegram) {
  document.documentElement.classList.add("tg");
  tg.ready();
  tg.expand();
}

const texts = {
  de: {
    title: "Einstellungen",
    footer: "Nur zur Ansicht. Ändern kannst du alles im Chat mit dem Bot.",
    none: "In diesem Link stecken keine Einstellungen. Öffne die Seite über den Button ⚙️ Einstellungen im Chat mit dem Bot.",
    old: "Diese Telegram-Version kann die Einstellungen hier nicht anzeigen. Im Chat zeigen /filter und /profile sie auch.",
    bad: "Die Einstellungen in diesem Link sind unlesbar. Im Chat zeigen /filter und /profile sie auch.",
  },
  en: {
    title: "Settings",
    footer: "View only. Change anything in the chat with the bot.",
    none: "This link carries no settings. Open the page with the ⚙️ Settings button in the chat with the bot.",
    old: "This Telegram app can't show the settings here. In the chat, /filter and /profile show them too.",
    bad: "The settings in this link can't be read. In the chat, /filter and /profile show them too.",
  },
};
const guess = (navigator.language || "de").toLowerCase().startsWith("de") ? "de" : "en";
let t = texts[guess];

// Telegram adds its own parameters to the fragment, before or after ours.
function payload() {
  const m = /(?:^#|[#&?])rs=([A-Za-z0-9_-]+)/.exec(location.hash);
  return m ? m[1] : "";
}

async function decode(s) {
  const b64 = s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4);
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(stream).text());
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function showError(msg) {
  const main = document.getElementById("main");
  main.replaceChildren(el("p", "", msg));
  main.firstChild.id = "error";
}

function render(view) {
  if (texts[view.l]) t = texts[view.l];
  document.documentElement.lang = view.l || guess;
  document.title = t.title;
  const main = document.getElementById("main");
  main.replaceChildren();
  for (const sec of view.s || []) {
    main.append(el("h2", "", sec.h));
    const card = el("div", "card");
    if (sec.n) card.append(el("div", "note", sec.n));
    for (const [label, value] of sec.r || []) {
      const long = value.length > 32 || label.length + value.length > 48;
      const row = el("div", long ? "row long" : "row");
      row.append(el("div", "label", label), el("div", "value", value));
      card.append(row);
    }
    if (sec.f) card.append(el("div", "foot", sec.f));
    main.append(card);
  }
  main.append(el("footer", "", t.footer));
}

(async () => {
  const s = payload();
  if (!s) return showError(t.none);
  if (typeof DecompressionStream === "undefined") return showError(t.old);
  let view;
  try {
    view = await decode(s);
  } catch (_) {
    return showError(t.bad);
  }
  render(view);
})();
</script>
</body>
</html>
